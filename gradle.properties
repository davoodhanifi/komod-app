#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M
# Workaround for IrTypeAliasSymbolImpl duplicate-symbol crash when supabase klib and
# Kotlin 2.x stdlib both contribute kotlinx.datetime/Instant. Remove once supabase or
# kotlinx-datetime ships a klib built against the same Kotlin version as this project.
kotlin.native.cacheKind=none
# The K/N compiler's default heap isn't enough to link a *release* framework (full
# LTO/devirtualization) with cacheKind=none above — it OOMs. Bump it explicitly.
kotlin.native.jvmArgs=-Xmx6g

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
android.suppressUnsupportedCompileSdk=37.0

#App
appVersion=1.0
